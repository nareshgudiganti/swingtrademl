name: Deploy to production

# Only runs when code lands on `main` — merging into `develop` (day-to-day
# work) never triggers this. Promoting develop -> main is the deliberate
# "go live" act, matching the same manual-approval caution this app already
# applies to real trading (see docs/superpowers/research on prod history).
on:
  push:
    branches: [main]
  workflow_dispatch: {} # manual "Run workflow" button, for a re-deploy with no new commits

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          script: |
            set -e
            cd /root/app

            echo "== backing up the database before migrating =="
            mkdir -p /root/backups
            STAMP=$(date +%Y%m%d_%H%M%S)
            docker exec stml-postgres pg_dumpall -U swingtrade > /root/backups/pgdumpall_$STAMP.sql
            # Keep the last 14 backups only — a daily-deploy cadence at this
            # size (~30MB each) is a few hundred MB/month otherwise.
            ls -t /root/backups/pgdumpall_*.sql | tail -n +15 | xargs -r rm --

            echo "== pulling latest main =="
            git fetch origin main
            git reset --hard origin/main

            echo "== building new images =="
            docker compose -f docker-compose.yml -f docker-compose.prod.yml build api worker frontend

            echo "== running migrations (one-off container, DB already backed up above) =="
            docker compose -f docker-compose.yml -f docker-compose.prod.yml run --rm api python -m alembic upgrade head

            echo "== swapping in the new containers =="
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d api worker frontend

            echo "== waiting for health =="
            sleep 10
            docker exec stml-api curl -sf http://localhost:8000/api/v1/health

            echo "== pruning old images (keeps disk from filling up over time) =="
            docker image prune -f

            echo "== deploy complete =="
