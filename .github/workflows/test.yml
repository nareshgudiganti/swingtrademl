# Lint and test on every push to develop and on every pull request.
#
# Deliberately NON-BLOCKING for now (continue-on-error on the lint step, and no
# required-status-check configured): the repo carries ~70 pre-existing ruff
# findings, mostly long lines in tests, and failing every build on debt that
# predates this workflow would train everyone to ignore it. Tests, which are
# green today, DO fail the build.
#
# Promote lint to blocking once the existing findings are cleared.

name: test

on:
  push:
    branches: [develop]
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        # Must match docker-compose.yml — the schema depends on TimescaleDB and
        # pg_trgm, which the stock postgres image does not carry.
        image: timescale/timescaledb:latest-pg17
        env:
          POSTGRES_USER: swingtrade
          POSTGRES_PASSWORD: swingtrade_local_pw
          POSTGRES_DB: swing_trade_ml_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U swingtrade"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Create extensions
        # conftest.py builds the schema with create_all(), but the models and
        # indexes still expect these to exist.
        env:
          PGPASSWORD: swingtrade_local_pw
        run: |
          psql -h localhost -p 5433 -U swingtrade -d swing_trade_ml_test \
            -c "CREATE EXTENSION IF NOT EXISTS timescaledb CASCADE;" \
            -c "CREATE EXTENSION IF NOT EXISTS pg_trgm;"

      - name: Lint
        working-directory: backend
        continue-on-error: true   # see header — advisory until the backlog is cleared
        run: ruff check src tests

      - name: Test
        working-directory: backend
        env:
          # conftest.py pins the rest; this must point at the service above.
          DATABASE_URL: postgresql+psycopg://swingtrade:swingtrade_local_pw@localhost:5433/swing_trade_ml_test
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit
