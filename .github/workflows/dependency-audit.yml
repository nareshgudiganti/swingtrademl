# Weekly check for libraries with known security holes (tracker qa4).
#
# Backend: installs the app exactly like the Docker build (newest versions pyproject allows, no
# lockfile) and runs pip-audit. Frontend: npm audit on the lockfile.
#
# FAILS on: any backend finding not in the ignore list below, and high/critical findings in
# frontend code that ships to the browser (--omit=dev). Build/test-only tools (vitest, capacitor
# cli) are reported but do not fail the run: they never reach prod.
#
# Ignore list (each needs a reason; re-check monthly, see docs/QUALITY-CHECKS.md):
#   PYSEC-2020-25, PYSEC-2026-4027  autobahn 19.11.2 is pinned exactly by kiteconnect; we do not
#                                   use its websocket server. Clears when kiteconnect unpins it.
#   CVE-2026-106454                 twisted, no fixed version published yet (2026-10-18).

name: dependency-audit

on:
  schedule:
    - cron: "30 3 * * 1"   # Monday 09:00 IST
  pull_request:
    paths:
      - backend/pyproject.toml
      - frontend/package.json
      - frontend/package-lock.json
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install like the Docker build
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install . pip-audit
      - name: pip-audit
        run: |
          pip-audit --skip-editable \
            --ignore-vuln PYSEC-2020-25 \
            --ignore-vuln PYSEC-2026-4027 \
            --ignore-vuln CVE-2026-106454

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Shipped code (fails on high/critical)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
      - name: Build and test tools (report only)
        working-directory: frontend
        continue-on-error: true
        run: npm audit --audit-level=high
