# Production override — combine with docker-compose.yml:
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# The base file's frontend service builds Vite's *dev server* (hot reload,
# unminified, HMR websocket exposed) — correct for local development, wrong
# for a real deployment. This override rebuilds it against the Dockerfile's
# `production` target instead: a static Vite build served by its own internal
# nginx, with no source maps or dev tooling exposed. Nothing else changes —
# postgres/redis/api/worker are identical to local, since those were already
# correct in production.
#
# The host's own nginx (see /etc/nginx/sites-available) reverse-proxies
# swingtrademl.com's "/" to this container's published port, same as it
# already does for "/api/" to the api container.

services:
  worker:
    environment:
      # Second copy of every trained model (ml/backup.py, daily at 16:30 IST).
      # Its own volume, so losing or wiping model_data does not take the
      # backup with it. Same disk, though - not a substitute for off-server.
      MODEL_BACKUP_DIR: /app/data/model_backups
    volumes:
      - model_backups:/app/data/model_backups

  frontend:
    build:
      target: production
      args:
        # Must be a build ARG, not a .env.production file — see the comment
        # in frontend/Dockerfile's build stage for why: .dockerignore
        # excludes .env* from the build context entirely, which silently
        # broke this in every build until this was made a real build arg.
        VITE_API_BASE_URL: https://swingtrademl.com/api/v1
    container_name: stml-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - api

volumes:
  model_backups:
