# Render Blueprint — deploys api, worker, and frontend from the same images
# used locally (docker-compose.yml). See https://render.com/docs/blueprint-spec
#
# Two things this blueprint deliberately does NOT solve, both already called
# out in README.md's "Path to cloud" section:
#
# 1. Database: Render's managed Postgres does not support the TimescaleDB
#    extension that `candles` (a hypertable) requires. DATABASE_URL below is
#    left unset (sync: false) — point it at a Timescale Cloud instance
#    (https://console.cloud.timescale.com), which is wire-compatible, has a
#    free tier, and needs no code changes.
#
# 2. Model artifacts: Render's persistent disks are per-service, not shared
#    across services — unlike the `model_data` volume in docker-compose.yml
#    that both api and worker mount. A model trained/loaded on one service
#    would not be visible to the other. Until MODEL_ARTIFACT_DIR points at
#    S3/GCS (README's item 3), do not rely on retraining in production —
#    train locally and treat Render as inference/paper-trading only, or
#    accept that training must happen via the worker's own shell.
#
# Migrations run once per deploy via api's preDeployCommand (DB_AUTO_MIGRATE
# is off on both services), so two replicas can never race on `alembic
# upgrade head`.

services:
  - type: web
    name: swingtrade-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter
    healthCheckPath: /api/v1/health
    preDeployCommand: alembic upgrade head
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DB_AUTO_MIGRATE
        value: "false"
      - key: ENABLE_SCHEDULER
        value: "false"
      - key: DATABASE_URL
        sync: false # Timescale Cloud connection string
      - key: REDIS_URL
        fromService:
          type: redis
          name: swingtrade-redis
          property: connectionString
      - key: API_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: KITE_API_KEY
        sync: false
      - key: KITE_API_SECRET
        sync: false
      - key: TELEGRAM_ENABLED
        value: "false"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false

  - type: worker
    name: swingtrade-worker
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DB_AUTO_MIGRATE
        value: "false"
      - key: ENABLE_SCHEDULER
        value: "true"
      - key: DATABASE_URL
        sync: false # same Timescale Cloud connection string as swingtrade-api
      - key: REDIS_URL
        fromService:
          type: redis
          name: swingtrade-redis
          property: connectionString
      - key: API_KEY
        sync: false # copy the value Render generated for swingtrade-api
      - key: JWT_SECRET_KEY
        sync: false # copy the value Render generated for swingtrade-api
      - key: KITE_API_KEY
        sync: false
      - key: KITE_API_SECRET
        sync: false
      - key: TELEGRAM_ENABLED
        value: "false"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false

  - type: redis
    name: swingtrade-redis
    plan: starter
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

  - type: web
    name: swingtrade-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://swingtrade-api.onrender.com/api/v1
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
