name: Deploy to production

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: "Deploy even between 09:00 and 16:30 IST on a weekday (emergency fix only)"
        type: boolean
        default: false

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  # A deploy restarts the worker. Between 09:00 and 16:30 IST on weekdays that can cut off exits, the
  # 09:15 approvals, the 15:50 brain run (a lost trial night) or the 16:20 daily check. On 2026-10-15 a
  # deploy started at 16:00, minutes after the brain run. Tracker tv20. Checked first, so a refused
  # deploy does not spend a test run.
  window:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse during market hours and the nightly brain run (IST)
        env:
          FORCE: ${{ inputs.force }}
        run: |
          now=$(TZ=Asia/Kolkata date '+%a %d %b %H:%M IST')
          hm=$(TZ=Asia/Kolkata date +%H%M); day=$(TZ=Asia/Kolkata date +%u)
          if [ "$day" -le 5 ] && [ "$hm" -ge 0900 ] && [ "$hm" -lt 1630 ]; then
            if [ "$FORCE" = "true" ]; then
              echo "::warning::Forced deploy at $now, inside 09:00-16:30 IST. The worker restarts now."
              exit 0
            fi
            echo "::error::Not deploying at $now: 09:00-16:30 IST on weekdays is market hours and the nightly brain run, and a deploy restarts the worker. Re-run this workflow after 16:30 IST (open this run, then Re-run all jobs). For an emergency fix: Actions, Deploy to production, Run workflow with force ticked."
            exit 1
          fi
          echo "OK to deploy at $now."

  validate:
    needs: window
    uses: ./.github/workflows/test.yml

  deploy:
    needs: [window, validate]
    if: github.ref == 'refs/heads/main'
    # The server key lives in the "production" environment, which only main may use, so a
    # workflow pushed on any other branch cannot read it.
    environment: production
    runs-on: ubuntu-latest
    steps:
      - name: Deploy tested commit over SSH
        uses: appleboy/ssh-action@v1.2.5
        env:
          RELEASE_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: RELEASE_SHA
          command_timeout: 30m
          script_stop: true
          script: |
            set -eu
            cd /root/app
            PREVIOUS_SHA=$(git rev-parse HEAD)
            git fetch origin "$RELEASE_SHA"
            git checkout --detach "$RELEASE_SHA"
            bash infra/deploy/release.sh "$RELEASE_SHA" "$PREVIOUS_SHA"

  # After-deploy smoke test (tracker qa2). release.sh already checks the release from INSIDE the
  # droplet (verify.py). This checks from OUTSIDE, as a user would: health/ready, paper mode (a live
  # trading mode fails loudly), brain stage, risk limits, and the / and /trademind pages. Read-only:
  # GET requests only, response bodies are never printed (public repo, public logs). Retries for
  # ~2.5 minutes while containers restart. On failure it messages the owner on Telegram, the same way
  # uptime.yml does. Without the API_KEY repository secret the authed checks are skipped with a warning.
  smoke:
    needs: deploy
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: infra/deploy/smoke.py
          sparse-checkout-cone-mode: false

      - name: Smoke test the live site (read-only)
        id: smoke
        env:
          SMOKE_BASE_URL: https://swingtrademl.com
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          if [ -z "$API_KEY" ]; then
            echo "::warning::No API_KEY repository secret: paper-mode, brain-stage and risk-limit checks skipped."
          fi
          python3 infra/deploy/smoke.py

      - name: Message on Telegram
        if: failure() && steps.smoke.outcome == 'failure'
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          PROBLEMS: ${{ steps.smoke.outputs.problems }}
          SHA: ${{ github.sha }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$CHAT" ]; then echo "::warning::No Telegram secrets; cannot message."; exit 0; fi
          when=$(TZ=Asia/Kolkata date '+%d %b %H:%M IST')
          text=$(printf '🔴 TradeMind deploy %s finished, but the after-deploy check FAILED (%s)\n%s\nOpen GitHub, Actions, Deploy to production for details. To undo: revert the commit and push.' "${SHA:0:7}" "$when" "${PROBLEMS:-the smoke test did not finish}")
          curl -s -m 20 -o /dev/null -w 'telegram %{http_code}\n' "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT}" --data-urlencode "text=${text}"
