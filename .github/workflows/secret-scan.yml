# Secret scan on every push and pull request (tracker qa3).
#
# The repo is PUBLIC: a Kite key, access token, password or bot token pushed to ANY branch is
# leaked, even if the commit is removed later. This scans the whole git history with gitleaks
# (rules + fake-value allowlist in .gitleaks.toml) and fails the run if anything is found.
# Findings are redacted in the log, so the scan itself never prints a secret.
#
# If it fails: do NOT just delete the line in a new commit. Rotate the key first (it is public
# already), then clean it up. See docs/QUALITY-CHECKS.md.

name: secret-scan

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch: {}
  workflow_call: {}

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan full history
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 \
            git /repo --config /repo/.gitleaks.toml --redact --no-banner --log-opts="--all"
