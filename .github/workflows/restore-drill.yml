name: Restore drill

# A button (Actions -> Restore drill -> Run workflow) that proves the newest database backup on the
# droplet can be restored. Runs infra/deploy/restore-drill.sh over the same SSH key the deploy uses:
# it restores into a throwaway container, compares row counts with the live database (read-only),
# and removes the container. It never writes to the live database and never touches trading.
#
# Database upgrade test (tracker qa5): with "upgrade_check" ticked it then runs `alembic upgrade head`
# on the restored copy with the code of "ref" (empty = the deployed commit), and reports the database
# revision before and after. Run it with the branch name BEFORE merging a branch that adds a migration.
# The migration runs inside the throwaway container's isolated network only (guards in the script).
on:
  workflow_dispatch:
    inputs:
      upgrade_check:
        description: "Also run alembic upgrade head on the restored copy (database upgrade test)"
        type: boolean
        default: true
      ref:
        description: "Code whose migrations to test: branch, tag or commit (empty = what is deployed)"
        type: string
        default: ""

concurrency:
  group: restore-drill
  cancel-in-progress: false

jobs:
  drill:
    # Server key: "production" environment, main only (see deploy.yml).
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Run the restore drill on the droplet
        uses: appleboy/ssh-action@v1.0.3
        env:
          UPGRADE_CHECK: ${{ inputs.upgrade_check && '1' || '0' }}
          UPGRADE_REF: ${{ inputs.ref }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 35m
          envs: UPGRADE_CHECK,UPGRADE_REF
          script: |
            set -e
            # Market hours (IST, weekdays 09:00-16:30) are for the trial; the drill uses disk and CPU.
            now=$(TZ=Asia/Kolkata date +%H%M); day=$(TZ=Asia/Kolkata date +%u)
            if [ "$day" -le 5 ] && [ "$now" -ge 0900 ] && [ "$now" -lt 1630 ]; then
              echo "Market hours in India: run the drill after 16:30 IST or before 09:00." >&2
              exit 1
            fi
            df -h /
            # A ref is passed to git fetch; allow only plain branch/tag/commit characters.
            case "$UPGRADE_REF" in -*|*[!A-Za-z0-9._/-]*) echo "Bad ref: use a branch, tag or commit." >&2; exit 1 ;; esac
            UPGRADE_CHECK="$UPGRADE_CHECK" UPGRADE_REF="$UPGRADE_REF" bash /root/app/infra/deploy/restore-drill.sh
