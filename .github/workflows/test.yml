# Lint and test on every push to develop and on every pull request.
#
# Deliberately NON-BLOCKING for now (continue-on-error on the lint step, and no
# required-status-check configured): the repo carries ~70 pre-existing ruff
# findings, mostly long lines in tests, and failing every build on debt that
# predates this workflow would train everyone to ignore it. Tests, which are
# green today, DO fail the build.
#
# Promote lint to blocking once the existing findings are cleared.

name: test

on:
  push:
    branches: [develop]
  pull_request:
  workflow_dispatch: {}
  workflow_call: {}

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        # Must match docker-compose.yml — the schema depends on TimescaleDB and
        # pg_trgm, which the stock postgres image does not carry.
        image: timescale/timescaledb:latest-pg17
        env:
          POSTGRES_USER: swingtrade
          POSTGRES_PASSWORD: swingtrade_local_pw
          POSTGRES_DB: swing_trade_ml_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U swingtrade"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v7
        with:
          # Full history and tags: the Observatory's verdict tests check that a frozen protocol's tag
          # still points at the recorded commit (tests/test_brain_observatory_verdicts_ci.py, E1).
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Create extensions
        # conftest.py builds the schema with create_all(), but the models and
        # indexes still expect these to exist.
        env:
          PGPASSWORD: swingtrade_local_pw
        run: |
          psql -h localhost -p 5433 -U swingtrade -d swing_trade_ml_test \
            -c "CREATE EXTENSION IF NOT EXISTS timescaledb CASCADE;" \
            -c "CREATE EXTENSION IF NOT EXISTS pg_trgm;"

      - name: Lint
        working-directory: backend
        continue-on-error: true   # see header — advisory until the backlog is cleared
        run: ruff check src tests

      - name: Test
        working-directory: backend
        env:
          # conftest.py pins the rest; this must point at the service above.
          DATABASE_URL: postgresql+psycopg://swingtrade:swingtrade_local_pw@localhost:5433/swing_trade_ml_test
        run: pytest -q --cov=swing_trade_ml --cov-report=json

      - name: Money-code coverage floor
        # qa8: fails the build if line coverage of risk, limits, exit policy, execution or the
        # brokers drops below its floor. Floors live in the script; see docs/QUALITY-CHECKS.md.
        working-directory: backend
        run: python scripts/check_money_coverage.py coverage.json

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Unit tests
        working-directory: frontend
        run: npm test

      - name: Production build
        working-directory: frontend
        run: npm run build

  # Browser journeys (qa1) and accessibility checks (qa10). No backend: every API call is answered from
  # frontend/e2e/fixtures. Chromium only. Nothing is uploaded (no traces, screenshots or reports): the repo is public.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Typecheck browser tests
        working-directory: frontend
        run: npm run e2e:typecheck

      - name: Browser and accessibility tests
        working-directory: frontend
        run: npm run e2e
